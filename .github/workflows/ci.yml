name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Fzerey.DDDStarter.sln

      - name: Build
        run: dotnet build Fzerey.DDDStarter.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Fzerey.DDDStarter.sln --no-build --configuration Release

      - name: Check for missing EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes \
            --project Fzerey.DDDStarter.Infrastructure \
            --startup-project Fzerey.DDDStarter.WebApi \
            --configuration Release \
            --no-build
